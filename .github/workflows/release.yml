name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: sha256sum path-cursor-pet.vsix > path-cursor-pet.vsix.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" path-cursor-pet.vsix path-cursor-pet.vsix.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" path-cursor-pet.vsix path-cursor-pet.vsix.sha256 --generate-notes
          fi
